services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uab
      POSTGRES_PASSWORD: uab_demo_password
      POSTGRES_DB: uab
    ports: ["5432:5432"]
    volumes: ["uab_pg:/var/lib/postgresql/data"]
  clickhouse:
    image: clickhouse/clickhouse-server:24
    environment:
      CLICKHOUSE_DB: uab
      CLICKHOUSE_USER: uab
      CLICKHOUSE_PASSWORD: uab_demo_password
    ports: ["8123:8123"]
    volumes: ["uab_ch:/var/lib/clickhouse"]
volumes:
  uab_pg:
  uab_ch:
